[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "do-it-yourself-lisp"
version = "1.0.0"
description = "Небольшой Lisp и дуэль магов поверх него"
requires-python = ">=3.10"
dependencies = ["pygame-ce==2.5.7"]

[project.scripts]
lisp-repl = "lisp.cli:run"
wizard-game = "wizard_game.pygame_app:run"
wizard-game-cli = "wizard_game.cli:run"

[tool.setuptools.packages.find]
include = ["lisp*", "wizard_game*"]
